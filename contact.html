<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>联系我们 - 摩尔信息科技</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #0b1c2c;
      --muted: #5a6b7c;
      --line: rgba(11, 28, 44, 0.08);
      --cyan: #00a8b8;
      --surface: #f7fafc;
      --nav: rgba(247, 250, 252, 0.86);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: "Noto Sans SC", "PingFang SC", sans-serif;
      color: var(--ink);
      background: var(--surface);
      line-height: 1.7;
    }
    a { color: inherit; text-decoration: none; }
    .site-nav {
      position: sticky; top: 0; z-index: 50;
      display: flex; align-items: center; justify-content: space-between; gap: 1.5rem;
      padding: 1rem 6%;
      background: var(--nav); backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--line);
    }
    .brand {
      font-family: Outfit, "Noto Sans SC", sans-serif;
      font-weight: 700; font-size: 1.15rem; letter-spacing: 0.04em;
      display: flex; align-items: center; gap: 0.55rem;
    }
    .brand-mark {
      width: 28px; height: 28px; border-radius: 6px;
      background: linear-gradient(135deg, var(--cyan), #0b3a4a);
      position: relative; overflow: hidden;
    }
    .brand-mark::after {
      content: ""; position: absolute; inset: 7px;
      border: 2px solid #fff; border-radius: 2px; opacity: 0.9;
    }
    .site-nav ul { display: flex; gap: 1.75rem; list-style: none; flex-wrap: wrap; }
    .site-nav a { font-size: 0.95rem; color: var(--muted); transition: color 0.25s ease; }
    .site-nav a:hover, .site-nav a.active { color: var(--ink); }

    .page-hero {
      position: relative; min-height: 42vh;
      display: flex; align-items: flex-end;
      padding: 0 6% 3.5rem; color: #fff; overflow: hidden; isolation: isolate;
    }
    .page-hero img {
      position: absolute; inset: 0; width: 100%; height: 100%;
      object-fit: cover; z-index: -2;
      animation: heroZoom 16s ease-out forwards;
    }
    .page-hero::after {
      content: ""; position: absolute; inset: 0; z-index: -1;
      background: linear-gradient(105deg, rgba(7,18,28,0.88), rgba(7,18,28,0.4));
    }
    .page-hero h1 {
      font-family: Outfit, "Noto Sans SC", sans-serif;
      font-size: clamp(2rem, 4vw, 3rem); font-weight: 700;
      animation: riseIn 0.8s cubic-bezier(0.22, 1, 0.36, 1) both;
    }
    .page-hero p {
      margin-top: 0.5rem; color: rgba(255,255,255,0.75);
      animation: riseIn 0.8s 0.1s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    .container {
      max-width: 900px; margin: 0 auto; padding: 4rem 6% 5rem;
      animation: riseIn 0.85s 0.12s cubic-bezier(0.22, 1, 0.36, 1) both;
    }
    .contact-panel {
      display: grid; gap: 1.35rem;
      padding: 2.25rem 0;
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
    }
    .contact-panel h2 {
      font-family: Outfit, "Noto Sans SC", sans-serif;
      font-size: 1.5rem; margin-bottom: 0.5rem;
    }
    .row {
      display: grid;
      grid-template-columns: 6.5rem 1fr;
      gap: 1rem;
      padding: 0.85rem 0;
      border-top: 1px solid var(--line);
    }
    .row:first-of-type { border-top: none; }
    .label {
      font-size: 0.85rem; letter-spacing: 0.08em;
      color: var(--cyan); font-weight: 500;
    }
    .value { color: var(--ink); font-size: 1.05rem; }
    .value a { color: var(--ink); border-bottom: 1px solid transparent; transition: border-color 0.2s; }
    .value a:hover { border-bottom-color: var(--cyan); }

    footer {
      border-top: 1px solid var(--line);
      padding: 2rem 6%; text-align: center; color: var(--muted); font-size: 0.9rem;
    }

    @keyframes riseIn {
      from { opacity: 0; transform: translateY(18px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes heroZoom {
      from { transform: scale(1.06); }
      to { transform: scale(1); }
    }
    @media (max-width: 820px) {
      .site-nav { flex-direction: column; align-items: flex-start; }
      .page-hero { min-height: 34vh; }
      .row { grid-template-columns: 1fr; gap: 0.25rem; }
    }
  </style>
</head>
<body>
  <nav class="site-nav">
    <a class="brand" href="index.html">
      <span class="brand-mark" aria-hidden="true"></span>
      摩尔信息科技
    </a>
    <ul>
      <li><a href="index.html">首页</a></li>
      <li><a href="about.html">公司简介</a></li>
      <li><a href="business.html">主营业务</a></li>
      <li><a class="active" href="contact.html">联系我们</a></li>
    </ul>
  </nav>

  <header class="page-hero">
    <img
      src="https://images.unsplash.com/photo-1486406146926-c627a92ad1ab?auto=format&fit=crop&w=1600&q=80"
      alt="城市科技建筑外景"
      width="1600"
      height="900">
    <div>
      <h1>联系我们</h1>
      <p>业务咨询与合作对接</p>
    </div>
  </header>

  <main class="container">
    <div class="contact-panel">
      <h2>长沙摩尔信息科技有限公司</h2>
      <div class="row">
        <span class="label">地址</span>
        <span class="value">湖南省长沙县金井镇惠农村楼利坡组101</span>
      </div>
      <div class="row">
        <span class="label">邮箱</span>
        <span class="value"><a href="mailto:postmaster@iosgame.online">postmaster@iosgame.online</a></span>
      </div>
      <div class="row">
        <span class="label">时间</span>
        <span class="value">周一至周五 9:00–18:00</span>
      </div>
    </div>
  </main>

  <footer>
    <p>© 2026 长沙摩尔信息科技有限公司 版权所有</p>
  </footer>
</body>
</html>
